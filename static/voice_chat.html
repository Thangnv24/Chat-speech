<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat RAG - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
        }

        #sidebar-header {
            padding: 20px;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        #sidebar-header h2 {
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #new-session-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        #new-session-btn:hover {
            background: #2980b9;
        }

        #sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px;
            margin: 5px 0;
            background: #34495e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            position: relative;
        }

        .session-item:hover {
            background: #4a5f7f;
        }

        .session-item.active {
            background: #3498db;
            border-left-color: #2ecc71;
        }

        .session-name {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rename-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0.7;
        }

        .rename-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
        }

        .session-time {
            font-size: 11px;
            opacity: 0.7;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        #chat-header {
            padding: 20px;
            background: white;
            border-bottom: 2px solid #ecf0f1;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-header h3 {
            color: #2c3e50;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #3498db;
            color: white;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #ecf0f1;
        }

        .message {
            margin: 15px 0;
            padding: 15px 20px;
            border-radius: 12px;
            max-width: 70%;
            animation: fadeIn 0.3s;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #3498db;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: white;
            color: #2c3e50;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-meta {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 8px;
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 12px;
            max-width: 70px;
            margin-right: auto;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #95a5a6;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-10px);
            }
        }

        #input-area {
            padding: 20px;
            background: white;
            border-top: 2px solid #ecf0f1;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #query {
            flex: 1;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        #query:focus {
            border-color: #3498db;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #send-btn {
            background: #3498db;
            color: white;
        }

        #send-btn:hover {
            background: #2980b9;
        }

        #voice-btn {
            background: #e74c3c;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 0;
            justify-content: center;
        }

        #voice-btn:hover {
            background: #c0392b;
        }

        #voice-btn.recording {
            background: #27ae60;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(231, 76, 60, 0);
            }
        }

        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #95a5a6;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        /* Modal for rename */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-buttons .cancel {
            background: #95a5a6;
            color: white;
        }

        .modal-buttons .save {
            background: #3498db;
            color: white;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h2>🎤 Voice Chat Sessions</h2>
            <button id="new-session-btn" onclick="newSession()">+ New Chat</button>
        </div>
        <div id="sessions-list"></div>
    </div>

    <div id="main">
        <div id="chat-header">
            <h3 id="session-title">Select or create a session</h3>
            <div class="mode-toggle">
                <button class="mode-btn" id="text-mode-btn" onclick="switchMode('text')">💬 Text</button>
                <button class="mode-btn active" id="voice-mode-btn" onclick="switchMode('voice')">🎤 Voice</button>
            </div>
        </div>
        <div id="messages">
            <div class="empty-state">
                <h3>🎤 Welcome to Voice Chat RAG!</h3>
                <p>Create a new session or select an existing one</p>
                <p>Click the microphone button to start voice chat</p>
            </div>
        </div>
        <div class="typing-indicator" id="typing">
            <span></span><span></span><span></span>
        </div>
        <div id="input-area">
            <input id="query" placeholder="Type your message or use voice..." disabled>
            <button class="btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
            <button class="btn" id="voice-btn" onclick="toggleVoiceRecording()" disabled>
                🎤
            </button>
        </div>
    </div>

    <!-- Rename Modal -->
    <div id="rename-modal" class="modal">
        <div class="modal-content">
            <h3>Rename Session</h3>
            <input type="text" id="rename-input" placeholder="Enter new name...">
            <div class="modal-buttons">
                <button class="cancel" onclick="closeRenameModal()">Cancel</button>
                <button class="save" onclick="saveSessionName()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/v1';
        let currentSession = null;
        let currentUser = null;
        let currentMode = 'voice';
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let renameSessionId = null;

        // Initialize
        async function init() {
            // Create or get user
            currentUser = localStorage.getItem('userId');
            if (!currentUser) {
                currentUser = crypto.randomUUID();
                localStorage.setItem('userId', currentUser);
            }

            // Ensure user exists in backend
            try {
                await fetch(`${API}/auth/users/quick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser,
                        email: `user_${currentUser.slice(0, 8)}@example.com`,
                        full_name: 'Voice User'
                    })
                });
            } catch (e) {
                console.log('User creation:', e.message);
            }

            await loadSessions();
        }

        async function newSession() {
            try {
                const res = await fetch(`${API}/sessions/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser })
                });

                if (!res.ok) throw new Error('Failed to create session');

                const session = await res.json();
                currentSession = session.session_id;

                await loadSessions();
                await selectSession(currentSession);

            } catch (error) {
                showError('Failed to create session: ' + error.message);
            }
        }

        async function loadSessions() {
            try {
                const res = await fetch(`${API}/sessions/`);
                const sessions = await res.json();

                const sessionsHtml = sessions.map(s => {
                    const isActive = s.session_id === currentSession;
                    const time = new Date(s.started_at).toLocaleString('vi-VN');
                    return `
                        <div class="session-item ${isActive ? 'active' : ''}" 
                             onclick="selectSession('${s.session_id}')">
                            <div class="session-name">
                                <span>${s.session_name || 'New Chat'}</span>
                                <button class="rename-btn" onclick="event.stopPropagation(); openRenameModal('${s.session_id}', '${s.session_name || ''}')">✏️</button>
                            </div>
                            <div class="session-time">${time}</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('sessions-list').innerHTML = sessionsHtml ||
                    '<p style="padding: 20px; opacity: 0.5;">No sessions yet</p>';

            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        async function selectSession(sessionId) {
            currentSession = sessionId;

            // Enable input
            document.getElementById('query').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('voice-btn').disabled = false;

            // Update UI
            await loadSessions();

            // Load messages
            try {
                const res = await fetch(`${API}/messages/session/${sessionId}`);
                const messages = await res.json();

                const messagesHtml = messages.map(m => `
                    <div class="message ${m.message_type.toLowerCase()}">
                        ${m.content}
                        <div class="message-meta">${new Date(m.created_at).toLocaleTimeString('vi-VN')}</div>
                    </div>
                `).join('');

                document.getElementById('messages').innerHTML = messagesHtml ||
                    '<div class="empty-state"><p>No messages yet. Start chatting!</p></div>';

                // Update header
                const sessionRes = await fetch(`${API}/sessions/${sessionId}`);
                const session = await sessionRes.json();
                document.getElementById('session-title').textContent =
                    session.session_name || 'Voice Chat Session';

                scrollToBottom();

            } catch (error) {
                showError('Failed to load messages: ' + error.message);
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            
            document.getElementById('text-mode-btn').classList.toggle('active', mode === 'text');
            document.getElementById('voice-mode-btn').classList.toggle('active', mode === 'voice');

            if (mode === 'text') {
                window.location.href = '/static/chat.html';
            }
        }

        async function toggleVoiceRecording() {
            if (!currentSession) {
                showError('Please select or create a session first');
                return;
            }

            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendVoiceMessage(audioBlob);
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;

                // Update UI
                const voiceBtn = document.getElementById('voice-btn');
                voiceBtn.classList.add('recording');
                voiceBtn.textContent = '⏹️';

                console.log('Recording started...');

            } catch (error) {
                showError('Microphone access denied: ' + error.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                // Update UI
                const voiceBtn = document.getElementById('voice-btn');
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';

                console.log('Recording stopped');
            }
        }

        async function sendVoiceMessage(audioBlob) {
            // Show typing indicator
            document.getElementById('typing').classList.add('active');

            // Disable buttons
            document.getElementById('voice-btn').disabled = true;
            document.getElementById('send-btn').disabled = true;

            try {
                // Create form data
                const formData = new FormData();
                
                // Determine file extension based on blob type
                let filename = 'voice.webm';
                if (audioBlob.type.includes('wav')) {
                    filename = 'voice.wav';
                } else if (audioBlob.type.includes('ogg')) {
                    filename = 'voice.ogg';
                }
                
                formData.append('audio_file', audioBlob, filename);

                console.log('Sending audio:', audioBlob.type, audioBlob.size, 'bytes');

                // Send to API
                const res = await fetch(`${API}/voice/chat?session_id=${currentSession}&language=vi&k=5&search_mode=hybrid`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Request failed');
                }

                const data = await res.json();

                // Hide typing indicator
                document.getElementById('typing').classList.remove('active');

                // Add user message (transcribed)
                addMessage(data.transcribed_text, 'user');

                // Add AI response
                addMessage(data.answer, 'ai', {
                    time: data.query_time,
                    docs: data.num_retrieved
                });

                // Optional: Play TTS response
                await playTTS(data.answer);

            } catch (error) {
                document.getElementById('typing').classList.remove('active');
                showError('Failed to send voice message: ' + error.message);
            } finally {
                // Re-enable buttons
                document.getElementById('voice-btn').disabled = false;
                document.getElementById('send-btn').disabled = false;
            }
        }

        async function playTTS(text) {
            try {
                const res = await fetch(`${API}/voice/tts?text=${encodeURIComponent(text)}&language=auto`, {
                    method: 'POST'
                });

                if (!res.ok) return;

                const audioBlob = await res.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();

            } catch (error) {
                console.log('TTS error:', error);
            }
        }

        async function sendMessage() {
            const query = document.getElementById('query').value.trim();
            if (!query || !currentSession) return;

            // Disable input
            const sendBtn = document.getElementById('send-btn');
            const queryInput = document.getElementById('query');
            sendBtn.disabled = true;
            queryInput.disabled = true;

            // Add user message to UI
            addMessage(query, 'user');
            queryInput.value = '';

            // Show typing indicator
            document.getElementById('typing').classList.add('active');

            try {
                const res = await fetch(`${API}/chat/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        session_id: currentSession,
                        k: 5,
                        search_mode: 'hybrid'
                    })
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Request failed');
                }

                const data = await res.json();

                // Hide typing indicator
                document.getElementById('typing').classList.remove('active');

                // Add AI response
                addMessage(data.answer, 'ai', {
                    time: data.query_time,
                    docs: data.num_retrieved
                });

            } catch (error) {
                document.getElementById('typing').classList.remove('active');
                showError('Failed to send message: ' + error.message);
            } finally {
                // Re-enable input
                sendBtn.disabled = false;
                queryInput.disabled = false;
                queryInput.focus();
            }
        }

        function addMessage(content, type, meta = null) {
            const messagesDiv = document.getElementById('messages');

            // Remove empty state if exists
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            let metaHtml = '';
            if (meta) {
                metaHtml = `<div class="message-meta">
                    ⏱️ ${meta.time?.toFixed(2)}s | 📚 ${meta.docs} docs
                </div>`;
            }

            messageDiv.innerHTML = `${content}${metaHtml}`;
            messagesDiv.appendChild(messageDiv);

            scrollToBottom();
        }

        function showError(message) {
            const messagesDiv = document.getElementById('messages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = '❌ ' + message;
            messagesDiv.appendChild(errorDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Rename session functions
        function openRenameModal(sessionId, currentName) {
            renameSessionId = sessionId;
            document.getElementById('rename-input').value = currentName;
            document.getElementById('rename-modal').classList.add('active');
        }

        function closeRenameModal() {
            document.getElementById('rename-modal').classList.remove('active');
            renameSessionId = null;
        }

        async function saveSessionName() {
            const newName = document.getElementById('rename-input').value.trim();
            
            if (!newName || !renameSessionId) {
                closeRenameModal();
                return;
            }

            try {
                const res = await fetch(`${API}/sessions/${renameSessionId}/name?session_name=${encodeURIComponent(newName)}`, {
                    method: 'PATCH'
                });

                if (!res.ok) throw new Error('Failed to rename session');

                await loadSessions();
                
                // Update header if current session
                if (renameSessionId === currentSession) {
                    document.getElementById('session-title').textContent = newName;
                }

                closeRenameModal();

            } catch (error) {
                showError('Failed to rename session: ' + error.message);
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const queryInput = document.getElementById('query');
                if (document.activeElement === queryInput) {
                    e.preventDefault();
                    sendMessage();
                }
            }

            // Space to start/stop recording (when not typing)
            if (e.code === 'Space' && document.activeElement !== document.getElementById('query')) {
                if (document.getElementById('rename-modal').classList.contains('active')) return;
                
                e.preventDefault();
                toggleVoiceRecording();
            }

            // Escape to close modal
            if (e.key === 'Escape') {
                closeRenameModal();
            }
        });

        // Initialize on load
        init();
    </script>
</body>

</html>
