<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat RAG - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }

        #sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        #sidebar-header {
            padding: 20px;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        #sidebar-header h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        #new-session-btn {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        #new-session-btn:hover {
            background: #2980b9;
        }

        #sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px;
            margin: 5px 0;
            background: #34495e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .session-item:hover {
            background: #4a5f7f;
        }

        .session-item.active {
            background: #3498db;
            border-left-color: #2ecc71;
        }

        .session-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .session-time {
            font-size: 11px;
            opacity: 0.7;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        #chat-header {
            padding: 20px;
            background: white;
            border-bottom: 2px solid #ecf0f1;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        #chat-header h3 {
            color: #2c3e50;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #ecf0f1;
        }

        .message {
            margin: 15px 0;
            padding: 15px 20px;
            border-radius: 12px;
            max-width: 70%;
            animation: fadeIn 0.3s;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #3498db;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: white;
            color: #2c3e50;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-meta {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 8px;
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 12px;
            max-width: 70px;
            margin-right: auto;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #95a5a6;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-10px);
            }
        }

        #input-area {
            padding: 20px;
            background: white;
            border-top: 2px solid #ecf0f1;
            display: flex;
            gap: 10px;
        }

        #query {
            flex: 1;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        #query:focus {
            border-color: #3498db;
        }

        #send-btn {
            padding: 15px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        #send-btn:hover {
            background: #2980b9;
        }

        #send-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #95a5a6;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h2>💬 Chat Sessions</h2>
            <button id="new-session-btn" onclick="newSession()">+ New Chat</button>
        </div>
        <div id="sessions-list"></div>
    </div>

    <div id="main">
        <div id="chat-header">
            <h3 id="session-title">Select or create a session</h3>
        </div>
        <div id="messages">
            <div class="empty-state">
                <h3>👋 Welcome to Chat RAG!</h3>
                <p>Create a new session or select an existing one to start chatting</p>
            </div>
        </div>
        <div class="typing-indicator" id="typing">
            <span></span><span></span><span></span>
        </div>
        <div id="input-area">
            <input id="query" placeholder="Type your message..." disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        const API = '/api/v1';
        let currentSession = null;
        let currentUser = null;

        // Initialize
        async function init() {
            // Create or get user
            currentUser = localStorage.getItem('userId');
            if (!currentUser) {
                currentUser = crypto.randomUUID();
                localStorage.setItem('userId', currentUser);
            }

            // Ensure user exists in backend
            try {
                await fetch(`/api/v1/auth/users/quick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser,
                        email: `user_${currentUser.slice(0, 8)}@example.com`,
                        full_name: 'Anonymous User'
                    })
                });
            } catch (e) {
                console.log('User creation:', e.message);
            }

            await loadSessions();
        }

        async function newSession() {
            try {
                const res = await fetch(`${API}/sessions/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser })
                });

                if (!res.ok) throw new Error('Failed to create session');

                const session = await res.json();
                currentSession = session.session_id;

                await loadSessions();
                await selectSession(currentSession);

            } catch (error) {
                showError('Failed to create session: ' + error.message);
            }
        }

        async function loadSessions() {
            try {
                const res = await fetch(`${API}/sessions/`);
                const sessions = await res.json();

                const sessionsHtml = sessions.map(s => {
                    const isActive = s.session_id === currentSession;
                    const time = new Date(s.started_at).toLocaleString('vi-VN');
                    return `
                        <div class="session-item ${isActive ? 'active' : ''}" 
                             onclick="selectSession('${s.session_id}')">
                            <div class="session-name">${s.session_name || 'New Chat'}</div>
                            <div class="session-time">${time}</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('sessions-list').innerHTML = sessionsHtml ||
                    '<p style="padding: 20px; opacity: 0.5;">No sessions yet</p>';

            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        async function selectSession(sessionId) {
            currentSession = sessionId;

            // Enable input
            document.getElementById('query').disabled = false;
            document.getElementById('send-btn').disabled = false;

            // Update UI
            await loadSessions();

            // Load messages
            try {
                const res = await fetch(`${API}/messages/session/${sessionId}`);
                const messages = await res.json();

                const messagesHtml = messages.map(m => `
                    <div class="message ${m.message_type.toLowerCase()}">
                        ${m.content}
                        <div class="message-meta">${new Date(m.created_at).toLocaleTimeString('vi-VN')}</div>
                    </div>
                `).join('');

                document.getElementById('messages').innerHTML = messagesHtml ||
                    '<div class="empty-state"><p>No messages yet. Start chatting!</p></div>';

                // Update header
                const sessionRes = await fetch(`${API}/sessions/${sessionId}`);
                const session = await sessionRes.json();
                document.getElementById('session-title').textContent =
                    session.session_name || 'Chat Session';

                scrollToBottom();

            } catch (error) {
                showError('Failed to load messages: ' + error.message);
            }
        }

        async function sendMessage() {
            const query = document.getElementById('query').value.trim();
            if (!query || !currentSession) return;

            // Disable input
            const sendBtn = document.getElementById('send-btn');
            const queryInput = document.getElementById('query');
            sendBtn.disabled = true;
            queryInput.disabled = true;

            // Add user message to UI
            addMessage(query, 'user');
            queryInput.value = '';

            // Show typing indicator
            document.getElementById('typing').classList.add('active');

            try {
                const res = await fetch(`${API}/chat/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        session_id: currentSession,
                        k: 5,
                        search_mode: 'hybrid'
                    })
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Request failed');
                }

                const data = await res.json();

                // Hide typing indicator
                document.getElementById('typing').classList.remove('active');

                // Add AI response
                addMessage(data.answer, 'ai', {
                    time: data.query_time,
                    docs: data.num_retrieved
                });

            } catch (error) {
                document.getElementById('typing').classList.remove('active');
                showError('Failed to send message: ' + error.message);
            } finally {
                // Re-enable input
                sendBtn.disabled = false;
                queryInput.disabled = false;
                queryInput.focus();
            }
        }

        function addMessage(content, type, meta = null) {
            const messagesDiv = document.getElementById('messages');

            // Remove empty state if exists
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            let metaHtml = '';
            if (meta) {
                metaHtml = `<div class="message-meta">
                    ⏱️ ${meta.time?.toFixed(2)}s | 📚 ${meta.docs} docs
                </div>`;
            }

            messageDiv.innerHTML = `${content}${metaHtml}`;
            messagesDiv.appendChild(messageDiv);

            scrollToBottom();
        }

        function showError(message) {
            const messagesDiv = document.getElementById('messages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = '❌ ' + message;
            messagesDiv.appendChild(errorDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const queryInput = document.getElementById('query');
                if (document.activeElement === queryInput) {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Initialize on load
        init();
    </script>
</body>

</html>
